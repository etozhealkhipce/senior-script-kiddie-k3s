# https://docs.k3s.io/add-ons/helm#customizing-packaged-components-with-helmchartconfig
# Same fix as coredns.yml: default probe timeouts (1s) are too tight for this
# node - a brief CPU/IO stall from any pod causes kubelet to kill
# metrics-server as a false positive (246 restarts observed in 32 minutes).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  valuesContent: |-
    livenessProbe:
      timeoutSeconds: 60
    readinessProbe:
      timeoutSeconds: 60

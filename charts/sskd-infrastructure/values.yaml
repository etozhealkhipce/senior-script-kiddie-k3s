namespace: sskd

ssl:
  email: alhipce@mail.ru
  domain: sskd.tech
  cloudflare:
    email: ""
    apiToken: ""

headlamp:
  enabled: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: ssl
    hosts:
      - host: headlamp.sskd.tech
        paths:
          - path: /
            type: Prefix
    tls:
      - secretName: headlamp-tls
        hosts:
          - headlamp.sskd.tech
  service:
    type: ClusterIP
    port: 80
  clusterRoleBinding:
    create: true
    clusterRoleName: cluster-admin

technitium-dnsserver:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: '30363'
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: ssl
      hosts:
        - host: dns.sskd.tech
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - dns.sskd.tech
          secretName: technitium-dns-tls
  service:
    main:
      type: LoadBalancer
      externalTrafficPolicy: Local
      ports:
        http:
          enabled: true
          port: 5380
          targetPort: 5380
          protocol: TCP
        https:
          enabled: false
        dhcp:
          enabled: false
        dot:
          enabled: false
        doh-reverse:
          enabled: false
        dns-udp:
          enabled: true
          port: 53
          protocol: UDP
        dns-tcp:
          enabled: true
          port: 53
          protocol: TCP
  persistence:
    config:
      enabled: true
      type: pvc
      size: 1Gi
      mountPath: /etc/dns

namespace: sskd

ssl:
  email: alhipce@mail.ru
  domain: sskd.tech
  cloudflare:
    email: ""
    apiToken: ""

headlamp:
  enabled: true
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  clusterRoleBinding:
    create: true
    clusterRoleName: cluster-admin

technitium-dnsserver:
  enabled: true
  service:
    main:
      type: LoadBalancer
      externalTrafficPolicy: Local
      ports:
        http:
          enabled: true
          port: 5380
          targetPort: 5380
          protocol: TCP
        dns-udp:
          enabled: true
          port: 53
          protocol: UDP
        dns-tcp:
          enabled: true
          port: 53
          protocol: TCP
  persistence:
    config:
      enabled: true
      type: pvc
      size: 1Gi
      mountPath: /etc/dns

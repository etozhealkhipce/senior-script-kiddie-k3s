namespace: sskd

ssl:
  email: alhipce@mail.ru
  domain: sskd.tech
  cloudflare:
    email: ""
    apiToken: ""

headlamp:
  enabled: true
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  clusterRoleBinding:
    create: true
    clusterRoleName: cluster-admin

technitium-dnsserver:
  enabled: true
  service:
    main:
      type: NodePort
      ports:
        http:
          nodePort: 30081
        dns-udp:
          nodePort: 30053
        dns-tcp:
          nodePort: 30053
  persistence:
    config:
      enabled: true
      type: pvc
      size: 1Gi
      mountPath: /etc/dns

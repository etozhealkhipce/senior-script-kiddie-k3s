apiVersion: v2
name: sskd-infrastructure
description: Infrastructure chart (namespace, SSL, Traefik, Headlamp, Pi-hole)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: headlamp
    version: "0.25.0"
    repository: https://kubernetes-sigs.github.io/headlamp/
    condition: headlamp.enabled
  - name: pihole
    version: "2.35.0"
    repository: https://mojo2600.github.io/pihole-kubernetes/
    condition: pihole.enabled
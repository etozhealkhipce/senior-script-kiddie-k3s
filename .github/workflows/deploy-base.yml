name: Deploy Base K3S Configuration

on:
  push:
    branches: [main]
    paths:
      - "base/**"
      - ".github/workflows/deploy-base.yml"
  pull_request:
    branches: [main]
    paths:
      - "base/**"
      - ".github/workflows/deploy-base.yml"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "base/*"
          target: "/tmp/k3s-deploy"
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /tmp/k3s-deploy

            kubectl apply -f namespace.yaml
            kubectl apply -f traefik-config.yaml
            kubectl apply -f middleware-https-redirect.yaml
            kubectl apply -f ingress.yaml

            kubectl wait --for=condition=Active namespace/sskd --timeout=60s

            rm -rf /tmp/k3s-deploy

            echo "FINISHED"

name: Deploy Base K3S Configuration

on:
  push:
    branches: [main]
    paths:
      - "base/**"
      - ".github/workflows/deploy-base.yml"
  pull_request:
    branches: [main]
    paths:
      - "base/**"
      - ".github/workflows/deploy-base.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4

      - name: COPY FILES
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "base/*"
          target: "/tmp/k3s-deploy"
          strip_components: 1

      - name: DEPLOY
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "CHECKING kubectl"
            if ! command -v kubectl &> /dev/null; then
                echo "kubectl NOT FOUND"
                exit 1
            fi

            cd /tmp/k3s-deploy

            echo "APPLYING NAMESPACE"
            kubectl apply -f namespace.yml

            echo "CREATING SECRETS"
            cat >secrets.yml << EOF
            apiVersion: v1
            kind: Secret
            metadata:
              name: common-secret
              namespace: sskd
            type: Opaque
            data:
              test: $(echo -n "${{ secrets.EMAIL }}" | base64 -w 0)
            EOF

            echo "APPLYING SECRETS"
            kubectl apply -f secrets.yml

            echo "WAITING FOR NAMESPACE"
            kubectl wait --for=condition=Active namespace/sskd --timeout=30s

            echo "APPLYING MANIFESTS"
            kubectl apply -f traefik-config.yml
            kubectl apply -f ingress.yml
            kubectl apply -f ssl.yml

            rm -rf /tmp/k3s-deploy

            echo "FINISHED"

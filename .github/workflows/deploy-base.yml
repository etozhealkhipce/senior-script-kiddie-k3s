name: Deploy Base K3S Configuration

on:
  push:
    branches: [main]
    paths:
      - "base/**"
      - ".github/workflows/deploy-base.yml"
  pull_request:
    branches: [main]
    paths:
      - "base/**"
      - ".github/workflows/deploy-base.yml"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate base configuration
        run: |
          echo "🔍 Validating base configuration..."

          for file in base/*.yaml; do
            echo "Validating $file..."
            kubectl apply --dry-run=client -f "$file"
          done

          echo "Validating kustomization.yaml..."
          kustomize build base/ --dry-run

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          kubectl cluster-info

      - name: Deploy base configuration
        run: |
          echo "🚀 Deploying base configuration to K3S..."

          kustomize build base/ | kubectl apply -f -

          kubectl wait --for=condition=Active namespace/sskd --timeout=60s

          echo "✅ Base configuration deployed successfully!"

name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "charts/sskd-infrastructure/**"
      - ".github/workflows/deploy-infrastructure.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: COPY CHARTS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "charts/sskd-infrastructure/*"
          target: "/tmp/sskd-infra"

      - name: DEPLOY
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /tmp/sskd-infra/charts/sskd-infrastructure

            helm dependency update

            helm upgrade --install sskd-infrastructure . --create-namespace

            echo "DEPLOYED"

            rm -rf /tmp/sskd-infra

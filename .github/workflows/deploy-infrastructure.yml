name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "charts/sskd-infrastructure/**"
      - ".github/workflows/deploy-infrastructure.yml"
  workflow_dispatch:
    inputs:
      server:
        description: "Target server"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: server-${{ inputs.server || '1' }}
    steps:
      - uses: actions/checkout@v4

      - name: COPY CHARTS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "charts/sskd-infrastructure/*"
          target: "/tmp/sskd-infra"

      - name: DEPLOY
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /tmp/sskd-infra/charts/sskd-infrastructure

            helm dependency update

            VALUES_OVERRIDE=""
            if [ "${{ inputs.server }}" = "2" ]; then
              VALUES_OVERRIDE="-f values-server2.yaml"
            fi

            helm upgrade --install sskd-infrastructure . --create-namespace $VALUES_OVERRIDE

            echo "DEPLOYED"

            rm -rf /tmp/sskd-infra

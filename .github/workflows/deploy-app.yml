# ================= #
# REUSABLE WORKFLOW #
# ================= #
name: Deploy App

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_host:
        required: false
        type: string
        default: ""
      values_file:
        required: false
        type: string
        default: "deploy/values.yml"
      app_secrets:
        required: false
        type: string
        default: ""
      udp_ports:
        # Список UDP-портов через запятую (напр. "16261,16262").
        # Если задан — создаётся LoadBalancer Service ${app}-udp (k3s ServiceLB
        # биндит порты на IP ноды). Пусто = ничего не создаётся (дефолт).
        required: false
        type: string
        default: ""
    secrets:
      # INFRA (for all repos)
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      GHCR_TOKEN:
        required: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: sskd
  BASE_REPO: etozhealkhipce/senior-script-kiddie-k3s

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: BUILD AND PUSH
        id: build
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

          TAG="sha-${GITHUB_SHA::7}"
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}:${TAG}"

          docker build -t $IMAGE .
          docker push $IMAGE

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: SECRETS
        id: secrets
        if: inputs.app_secrets != ''
        run: |
          IFS=',' read -ra SECRET_NAMES <<< "${{ inputs.app_secrets }}"

          cat > /tmp/secrets.json << 'SECRETS_EOF'
          ${{ toJSON(secrets) }}
          SECRETS_EOF

          SECRET_DATA=""
          SECRET_COUNT=0

          for secret_name in "${SECRET_NAMES[@]}"; do
            secret_name=$(echo "$secret_name" | xargs)
            
            value=$(jq -r --arg k "$secret_name" '.[$k]' /tmp/secrets.json)
            
            if [ -n "$value" ] && [ "$value" != "null" ]; then
              encoded=$(echo -n "$value" | base64 -w 0)
              SECRET_DATA="${SECRET_DATA}  ${secret_name}: ${encoded}\n"
              SECRET_COUNT=$((SECRET_COUNT+1))
            fi
          done

          rm -f /tmp/secrets.json

          echo "data=$(echo -e "$SECRET_DATA" | base64 -w 0)" >> $GITHUB_OUTPUT
          echo "PREPARED"

      - name: VALUES
        id: values
        run: |
          if [ -f "${{ inputs.values_file }}" ]; then
            echo "data=$(base64 -w 0 "${{ inputs.values_file }}")" >> "$GITHUB_OUTPUT"
          fi

      - name: DEPLOY
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ steps.build.outputs.tag }}
          APP: ${{ inputs.app_name }}
          HOST: ${{ inputs.app_host }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SECRET_DATA: ${{ steps.secrets.outputs.data }}
          VALUES_B64: ${{ steps.values.outputs.data }}
          UDP_PORTS: ${{ inputs.udp_ports }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,APP,HOST,REPO,OWNER,SECRET_DATA,VALUES_B64,UDP_PORTS
          script: |
            set -e
            export KUBECONFIG=~/.kube/config

            if [ -n "$SECRET_DATA" ]; then
              cat << EOF | kubectl apply -f -
            apiVersion: v1
            kind: Secret
            metadata:
              name: ${APP}-secrets
              namespace: ${{ env.NAMESPACE }}
            type: Opaque
            data:
            $(echo "$SECRET_DATA" | base64 -d)
            EOF
              echo "APP SECRETS APPLIED"
            fi

            kubectl create secret docker-registry ${APP}-ghcr-secret \
              --docker-server=${{ env.REGISTRY }} \
              --docker-username=${OWNER} \
              --docker-password=${{ secrets.GHCR_TOKEN }} \
              -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

            cd /tmp && rm -rf deploy-${APP}
            mkdir deploy-${APP} && cd deploy-${APP}

            git clone --depth 1 https://github.com/${{ env.BASE_REPO }}.git base

            cd base/charts/sskd-app

            helm dependency update

            VALUES=""
            if [ -n "$VALUES_B64" ]; then
              echo "$VALUES_B64" | base64 -d > /tmp/deploy-${APP}/values.yml
              VALUES="-f /tmp/deploy-${APP}/values.yml"
            fi

            INGRESS=""
            if [ -n "${HOST}" ]; then
              INGRESS="--set app.ingress.enabled=true --set app.ingress.host=${HOST}"
            fi

            helm upgrade --install ${APP} . \
              --namespace ${{ env.NAMESPACE }} \
              ${VALUES} \
              --set app.name=${APP} \
              --set app.image.repository=${{ env.REGISTRY }}/${REPO} \
              --set app.image.tag=${TAG} \
              ${INGRESS}

            echo "DEPLOYED"
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=${APP}

            if [ -n "$UDP_PORTS" ]; then
              {
                echo "apiVersion: v1"
                echo "kind: Service"
                echo "metadata:"
                echo "  name: ${APP}-udp"
                echo "  namespace: ${{ env.NAMESPACE }}"
                echo "  labels:"
                echo "    app: ${APP}"
                echo "spec:"
                echo "  type: LoadBalancer"
                echo "  externalTrafficPolicy: Local"
                echo "  selector:"
                echo "    app: ${APP}"
                echo "  ports:"
                for port in $(echo "$UDP_PORTS" | tr ',' ' '); do
                  echo "    - name: udp-${port}"
                  echo "      port: ${port}"
                  echo "      targetPort: ${port}"
                  echo "      protocol: UDP"
                done
              } | kubectl apply -f -
              echo "UDP SERVICE APPLIED (${UDP_PORTS})"
              kubectl get svc ${APP}-udp -n ${{ env.NAMESPACE }} -o wide
            fi

            rm -rf /tmp/deploy-${APP}

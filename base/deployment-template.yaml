apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: sskd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-deployment
  template:
    metadata:
      labels:
        app: app-deployment
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: app-container
          image: ghcr.io/your-org/app:latest
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: node_env
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: log_level
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: app_name
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: app_version

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

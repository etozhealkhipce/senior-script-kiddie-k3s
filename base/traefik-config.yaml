# Traefik configuration for K3S
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: kube-system
data:
  traefik.yml: |
    # Global settings
    global:
      checkNewVersion: false
      sendAnonymousUsage: false

    # API and Dashboard settings
    api:
      dashboard: true
      insecure: false

    # Entrypoints settings
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        address: ":443"
        http:
          tls:
            certResolver: letsencrypt

    # Certificates settings
    certificatesResolvers:
      letsencrypt:
        acme:
          email: admin@sskd.com
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web

    # Providers settings
    providers:
      kubernetesCRD: {}
      kubernetesIngress: {}

    # Logging settings
    log:
      level: INFO

    # Настройки доступа
    accessLog: {}

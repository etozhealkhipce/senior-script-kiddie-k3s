apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sskd-base

# Common resources for all services
resources:
  - namespace.yaml
  - configmap.yaml
  - secret-template.yaml
  - deployment-template.yaml
  - service-template.yaml
  - ingress-template.yaml
  - middleware-https-redirect.yaml
  - traefik-config.yaml

# Common settings for all resources
commonLabels:
  app.kubernetes.io/name: sskd
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/part-of: sskd

# Common annotations
commonAnnotations:
  config.kubernetes.io/local-config: "true"

# Variables for substitution
vars:
  - name: APP_NAME
    objref:
      kind: ConfigMap
      name: app-config
      apiVersion: v1
    fieldref:
      fieldpath: data.app_name
  - name: APP_VERSION
    objref:
      kind: ConfigMap
      name: app-config
      apiVersion: v1
    fieldref:
      fieldpath: data.app_version

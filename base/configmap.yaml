apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: sskd
data:
  app_name: "sskd"
  app_version: "1.0.0"
  environment: "production"
  domain: "sskd.com"
  log_level: "info"
  node_env: "production"
  prometheus_scrape_interval: "30s"
  liveness_initial_delay: "10"
  liveness_period: "30"
  liveness_timeout: "5"
  liveness_failure_threshold: "3"
  readiness_initial_delay: "5"
  readiness_period: "10"
  readiness_timeout: "3"
  readiness_failure_threshold: "3"
